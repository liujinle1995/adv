// 由 AGP 4.0.1 / compileSdk 28 升级到 AGP 8.7 / compileSdk 35
// 仅保留 arm64-v8a：目标设备（realme RMX3888 / Android 16）无 32 位运行时
plugins {
    id 'com.android.library'
}

android {
    namespace 'top.niunaijun.blackbox'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        minSdk 21
        consumerProguardFiles "consumer-rules.pro"
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('./src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // AGP 8 起 AIDL 编译默认关闭，必须显式开启，否则 Binder 代理接口全部丢失
    buildFeatures {
        aidl true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'UnusedResources', 'RestrictedApi'
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation 'androidx.appcompat:appcompat:1.6.1'

    implementation 'me.weishu:free_reflection:3.0.1'
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.2'

    implementation project(':bb-fake')
    implementation project(':bb-hook')
    implementation project(':bb-mirror')
    implementation project(':bb-pine-core')
    implementation project(':bb-pine-xposed')
    implementation project(':bb-pine-xposed-res')
}
